<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta 3D</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-color: #f0f0f0;
            perspective: 1000px;
        }

        .caja {
            position: relative;
            width: 300px;
            height: 300px;
            perspective: 1000px; /* Necesario para activar el efecto 3D */
            margin: auto;
        }

        .caja-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 1s;
            transform-style: preserve-3d; 
        }

        /* Al pasar el ratón se gira la tarjeta */
        .caja:hover .caja-inner {
            transform: rotateY(180deg);
        }

        /* Estilo común para ambas caras */
        .caraA, .caraB {
            position: absolute;
            width: 100%;
            height: 100%;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 3rem;
            backface-visibility: hidden; /* Oculta la cara trasera cuando está dada vuelta */
            box-sizing: border-box;
        }

        /* Cara frontal */
        .caraA {
            background-color: aqua;
        }

        /* Cara trasera */
        .caraB {
            background-image: url(batman.jpg);
            transform: rotateY(180deg); /* Arranca dada la vuelta */
            backface-visibility: hidden;
            color: white;
        }
    </style>
</head>

<body>
    <div class="caja">
        <div class="caja-inner">
            <div class="caraA">A</div>
            <div class="caraB">hola amego🚬</div>
        </div>
    </div>
</body>
</html>
